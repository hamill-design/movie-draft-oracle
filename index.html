    <!-- Analytics (Google tag, Meta Pixel, Crazy Egg).
         The queues/stubs are set up immediately so early gtag()/fbq() calls aren't lost, but the
         third-party scripts themselves only load once a visitor shows they're engaged: first
         scroll / tap / keypress, or ANALYTICS_DWELL_MS after the page's load event if they're
         just reading. Quick bounces and most bots are therefore not recorded (intentional).
         Skipped under automation, so the build-time prerender doesn't bake the injected
         <script> tags into the static HTML. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-DXTG605FYV');

      // Meta Pixel stub (same queue the stock snippet creates), minus the immediate script insert.
      !function(f,n){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];}(window);
      fbq('init', '1457902669385934');
      fbq('track', 'PageView');

      (function () {
        if (navigator.webdriver) return;
        var started = false;
        function add(src) {
          var s = document.createElement('script');
          s.async = true;
          s.src = src;
          document.head.appendChild(s);
        }
        function start() {
          if (started) return;
          started = true;
          add('https://www.googletagmanager.com/gtag/js?id=G-DXTG605FYV');
          add('https://connect.facebook.net/en_US/fbevents.js');
          add('https://script.crazyegg.com/pages/scripts/0131/8350.js');
        }
        var ANALYTICS_DWELL_MS = 8000;
        function schedule() {
          setTimeout(start, ANALYTICS_DWELL_MS);
        }
        if (document.readyState === 'complete') schedule();
        else window.addEventListener('load', schedule);
        ['pointerdown', 'keydown', 'touchstart', 'scroll'].forEach(function (evt) {
          window.addEventListener(evt, start, { once: true, passive: true });
        });
      })();
    </script>

    <!-- Preload the homepage hero image only on "/" so other routes don't download it -->
    <script>
      if (location.pathname === '/') {
        var l = document.createElement('link');
        l.rel = 'preload'; l.as = 'image';
        l.setAttribute('imagesrcset', '/images/home/hero-stills-800.webp 800w, /images/home/hero-stills-1600.webp 1600w');
        l.setAttribute('imagesizes', '100vw');
        l.setAttribute('fetchpriority', 'high');
        document.head.appendChild(l);
      }
    </script>
